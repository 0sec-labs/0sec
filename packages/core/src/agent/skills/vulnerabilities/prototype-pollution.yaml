id: prototype-pollution
name: "JavaScript Prototype Pollution"
description: "Prototype pollution via __proto__, constructor.prototype, and Object.assign — with gadget chains for RCE, XSS, privilege escalation, and auth bypass."
version: 1
applicable_roles:
