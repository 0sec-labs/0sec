id: cardano-eutxo-validators
name: "Cardano EUTXO Validator Logic Bugs (Aiken / Plutus)"
description: "Value-stealing logic bugs in Cardano on-chain validators — double satisfaction, missing signer checks, unconserved value, unauthorized minting, datum trust, staking/withdrawal tricks. No memory safety here; every bug is a constraint the validator forgets to enforce, exploited by a transaction the ledger admits."
version: 1
applicable_roles:
