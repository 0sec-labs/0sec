[package]
name = "zeroverse-windows-token-capture"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "zeroverse-windows-token-capture"

[features]
default = []
# Hosted-Windows-only LocalSystem lifecycle harness. This feature embeds
# test-only trust material and must never be enabled in release artifacts.
ci-system-test = []

[[bin]]
name = "windows-token-store-e2e"
path = "src/bin/windows-token-store-e2e.rs"
required-features = ["ci-system-test"]

[[bin]]
name = "windows-token-store-cleanup"
path = "src/bin/windows-token-store-cleanup.rs"
required-features = ["ci-system-test"]

[[bin]]
name = "windows-token-trusted-child-e2e"
path = "src/bin/windows-token-trusted-child-e2e.rs"
required-features = ["ci-system-test"]

[[bin]]
name = "windows-token-witness-donor"
path = "src/bin/windows-token-witness-donor.rs"
required-features = ["ci-system-test"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "=0.6.7", default-features = false, features = ["ed25519", "std"] }
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
