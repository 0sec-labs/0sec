name: "PwnKit: Publish Docker image"

# Build + push the pwnkit engine image to ghcr.io/<owner>/pwnkit.
#
# Trigger model — mirrors dashboard-build.yml / services-publish.yml so
# merged engine work doesn't drift out of production (see #522):
#
#   - successful PwnKit CI on main → SHA-tagged image + :main + refreshed
#                                    :latest. This is the rolling-main path
#                                    the worker-controller pins by default
#                                    (PWNKIT_IMAGE=…/pwnkit:latest).
#   - tag push (v*)                → SHA-tagged image AND a semver-tagged
#                                    image (…/pwnkit:0.1.0) for controlled
#                                    versioned releases.
#   - workflow_dispatch            → manual rebuild (still tags :latest).
#
# Main publishes are chained from `PwnKit: CI` instead of running directly on
# push, so a bad engine cannot refresh :latest before the CI suite has passed.
# Tag pushes still build directly.
on:
  workflow_run:
    workflows: ["PwnKit: CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Override tag (optional, defaults to "latest")
        required: false
        default: latest

permissions:
  contents: read
  packages: write

# Only one in-flight build per ref — a second push to main cancels the
# prior run rather than racing it to GHCR.
concurrency:
  group: pwnkit-docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Self-hosted X64 runner (same as worker-publish/dashboard-build) — far
    # faster than GitHub's 2-vCPU hosted runners and shares the buildx layer
    # cache with the other image builds. amd64-only (below) so no QEMU needed.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/pwnkit" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Tag plan (mirrors dashboard-build.yml / services-publish.yml):
          #   - sha          (every build, always)          abc1234
          #   - branch ref   (main pushes only)             main
          #   - :latest      (default-branch + dispatch)    latest
          #   - semver       (v* tag pushes only)           0.1.0 / 0.1 / 0
          # The :sha and :main tags make a rolling-main engine build
          # identifiable/testable without disturbing the :latest the
          # worker-controller pins; v* still cuts the versioned release.
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=pwnkit
            org.opencontainers.image.description=AI-powered agentic security scanner
            org.opencontainers.image.source=https://github.com/0sec-labs/pwnkit
            org.opencontainers.image.licenses=LicenseRef-Proprietary

      - name: Build and push
        id: build
        # amd64-only: <REDACTED_INTERNAL_INFRA> + E2B sandboxes are all amd64, so the previous
        # linux/arm64 leg was pure QEMU-emulated waste — 5-10x slower and the
        # cause of the build failures (the emulated leg OOM/timeout). Dropping
        # it fixes the build AND makes it much faster. One-shot retry mirrors
        # worker-publish for the self-hosted runner's intermittent buildx
        # graceful_stop/EOF failures.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pwnkit
          cache-to: type=gha,mode=max,scope=pwnkit

      - name: Re-authenticate to GHCR before retry
        if: steps.build.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pwnkit
          cache-to: type=gha,mode=max,scope=pwnkit

      - name: Notify 0sec E2B template workflow
        if: ${{ success() }}
        env:
          ZEROSEC_REPO_DISPATCH_TOKEN: ${{ secrets.ZEROSEC_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ZEROSEC_REPO_DISPATCH_TOKEN}" ]; then
            echo "::notice::ZEROSEC_REPO_DISPATCH_TOKEN is not set; skipping 0sec E2B template dispatch."
            exit 0
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${ZEROSEC_REPO_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/0sec-labs/0sec/dispatches \
            -d '{"event_type":"pwnkit-image-published","client_payload":{"image":"ghcr.io/0sec-labs/pwnkit:latest","sha":"${{ github.sha }}"}}'
