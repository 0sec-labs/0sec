name: "0sec: Release"

# Build the standalone `0sec` binary natively on each target OS and publish all
# four (+ checksums) to the GitHub Release. Native builds avoid `bun --compile`
# cross-compilation, which cannot resolve @opentui/core's per-platform native
# packages from a single host. Each binary is smoke-tested on its own runner
# before it ships.
#
# Trigger: pushing a `v*` tag, or manually via workflow_dispatch with the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + release (e.g. v0.14.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: 0sec-darwin-arm64
          - os: ubuntu-latest
            asset: 0sec-linux-x64
          - os: ubuntu-24.04-arm
            asset: 0sec-linux-arm64
          - os: windows-latest
            asset: 0sec-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 24: tree-sitter@0.21.1's native addon fails to compile
          # against Node 24's V8 (missing cppgc header) on linux-arm64, which has
          # no prebuilt. Node 22 compiles it from source cleanly.
          node-version: 22
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        # No --ignore-scripts: the native addon (tree-sitter) must build so the
        # compiled binary has a .node to load at runtime (arm64 has no prebuilt).
        run: pnpm install --no-frozen-lockfile
      - name: Build the CLI dependency closure
        # Only the 0sec-cli closure is needed for the binary. Building the whole
        # workspace (pnpm -r) also builds @0sec/docs, whose astro site 404s on
        # Windows and has nothing to do with the release binary.
        run: pnpm --filter "0sec-cli..." build
      - name: Compile native binary
        shell: bash
        run: bash scripts/bun-compile.sh "" "dist-bin/${{ matrix.asset }}"
      - name: Smoke the binary
        shell: bash
        run: |
          "dist-bin/${{ matrix.asset }}" --version
          "dist-bin/${{ matrix.asset }}" --help | grep -q "security research harness"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist-bin
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bin/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist-bin/* \
              --repo "${{ github.repository }}" \
              --title "0sec $TAG" \
              --notes "Automated multi-platform release. See CHANGELOG.md for changes." \
              --verify-tag
          fi
