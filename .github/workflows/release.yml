name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── npm publishing happens via .github/workflows/npm-publish.yml ──
  #
  # That workflow builds `dist-npm/` (a tiny shim, ~13 KB) via
  # `scripts/build-npm-shim.mjs` and publishes it manually. From v0.9.0
  # onwards the npm package is a redirect, not the engine. The previous
  # auto-publish step here tried to publish the full bundle (~2.6 MB) on
  # every release-published event and raced with `npm-publish.yml`,
  # producing a 403 when the shim got there first. Removed entirely so
  # there's exactly one canonical npm publish path.

  # Per-platform standalone binaries uploaded as Release assets.
  # Consumed by install.sh, which resolves platform at runtime and
  # downloads the matching asset from the latest release.
  #
  # Runner allocation mirrors binary-build.yml: self-hosted pool for
  # linux-x64, GH-hosted for linux-arm64 + darwin-arm64 + windows-x64.
  # Intel Mac (darwin-x64) is intentionally skipped — GH's macos-13
  # pool is unreliable and Apple stopped shipping Intel Macs in 2022.
  binaries:
    name: binary (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: '["self-hosted", "Linux", "X64"]'
          - label: linux-arm64
            runs_on: '"ubuntu-24.04-arm"'
          - label: darwin-arm64
            runs_on: '"macos-14"'
          - label: windows-x64
            runs_on: '"windows-latest"'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Clean workspace artifacts (self-hosted runners carry state)
        run: rm -rf dist-bin dist node_modules packages/*/node_modules packages/*/dist
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: corepack enable && corepack prepare pnpm@9 --activate
        shell: bash

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Compile standalone binary
        run: bash scripts/bun-compile.sh
        shell: bash

      - name: Rename binary with platform label
        id: rename
        run: |
          cd dist-bin
          if [ -f pwnkit.exe ]; then
            NAME="pwnkit-${{ matrix.label }}.exe"
            mv pwnkit.exe "$NAME"
          else
            NAME="pwnkit-${{ matrix.label }}"
            mv pwnkit "$NAME"
          fi
          echo "asset_name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh
        shell: bash

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist-bin/${{ steps.rename.outputs.asset_name }}" \
            --clobber
        shell: bash

  # Aggregate SHA-256 manifest. Runs once after every per-platform
  # binary has been uploaded, downloads them all back from the release,
  # generates `checksums.txt`, and uploads that as a sibling asset.
  #
  # The installer paths (install.sh + scripts/npm-launcher/launcher.cjs)
  # refuse to install a binary whose hash isn't listed in this manifest.
  # If this job fails or is skipped, the install paths fail-closed with
  # an actionable error rather than silently caching an unverified
  # binary — see the supply-chain section of SECURITY.md.
  checksums:
    name: checksums.txt
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-release
          # Pull every asset the per-platform jobs uploaded. The
          # pwnkit-* glob deliberately excludes any pre-existing
          # checksums.txt so we always re-generate from scratch.
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist-release \
            --pattern 'pwnkit-*'
          ls -lh dist-release

      - name: Generate checksums.txt
        run: |
          cd dist-release
          # sha256sum's default output is exactly the format install.sh
          # and the npm launcher parse: "<hex>  <filename>" per line.
          # Sort for reproducibility across platform orderings.
          sha256sum pwnkit-* | sort -k2 > checksums.txt
          echo "── checksums.txt ──"
          cat checksums.txt

      - name: Upload checksums.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            dist-release/checksums.txt \
            --clobber

  # Website auto-deploys via Cloudflare Pages Git integration
