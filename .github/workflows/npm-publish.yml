name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        required: true
        default: latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Build npm shim
        # From v0.9.0 onwards the npm package is a tiny shim that prints
        # install instructions for the self-contained binary and exits.
        # The full release is shipped via GitHub Releases + install.sh.
        run: node scripts/build-npm-shim.mjs

      - name: Publish shim
        env:
          DIST_TAG: ${{ inputs['dist-tag'] }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "$DIST_TAG"
        working-directory: dist-npm
