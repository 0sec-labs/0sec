name: "PwnKit: Public PR"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pwnkit-public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap runner
        run: bash "$GITHUB_WORKSPACE/scripts/ci-runner-bootstrap.sh"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
      - name: Type-check
        run: pnpm lint
      - name: Smoke CLI
        run: node dist/pwnkit.js --help
      - name: Run tests
        run: pnpm test:public
