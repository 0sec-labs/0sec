name: "0sec: Installation E2E"

# Verify the public commands in README.md and Getting Started, not a build-tree
# approximation. The image-publish completion trigger makes this run after the
# public :latest image is refreshed; the daily run catches upstream registry,
# GitHub Release, and base-image drift.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  workflow_run:
    workflows: ["0sec: Publish Docker image"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: 0sec-install-e2e
  cancel-in-progress: false

jobs:
  install:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: ${{ matrix.method }} install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        method: [binary, source, container]
    steps:
      - uses: actions/checkout@v6
        with:
          # These checks deliberately exercise the public default-branch surface.
          ref: ${{ github.event.repository.default_branch }}
      - name: Exercise documented ${{ matrix.method }} installation
        run: bash scripts/install-e2e.sh ${{ matrix.method }}
