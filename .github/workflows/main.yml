name: "0sec: Main"

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 0sec-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap runner
        run: bash "$GITHUB_WORKSPACE/scripts/ci-runner-bootstrap.sh"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
      - name: Type-check
        run: pnpm lint
      - name: Smoke CLI
        # The bundle keeps react/@opentui/* (and the native tree-sitter,
        # node-sqlite3-wasm, drizzle) EXTERNAL so it never ships a second React
        # instance beside OpenTUI's. Those externals live in the generated
        # dist/package.json but are not hoisted to the repo root, so the raw
        # bundle can't resolve them until we install them next to it. Mirror the
        # installed-tarball layout by installing the bundle's own deps into dist/
        # before smoking. Use `npm install --omit=dev` (not `npm ci`) so a lock
        # that lags the current react/@opentui versions can't fail the smoke.
        run: |
          (cd dist && npm install --omit=dev --no-audit --no-fund)
          node dist/0sec.js --help
      - name: Run tests
        run: pnpm test:public
        env:
          0SEC_CHATGPT_ACCESS_TOKEN: ""
          0SEC_CHATGPT_OAUTH_REFRESH_TOKEN: ""
          0SEC_CHATGPT_ACCOUNT_ID: ""
          0SEC_CHATGPT_AUTH_FILE: "/tmp/0sec-ci-no-auth.json"
          0SEC_CODEX_AUTH_JSON_PATH: "/tmp/0sec-ci-no-auth.json"
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          QWEN_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""
          KIMI_API_KEY: ""
