name: "0sec: Main"

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 0sec-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap runner
        run: bash "$GITHUB_WORKSPACE/scripts/ci-runner-bootstrap.sh"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
      - name: Type-check
        run: pnpm lint
      - name: Smoke CLI
        run: node dist/0sec.js --help
      - name: Run tests
        run: pnpm test:public
        env:
          0SEC_CHATGPT_ACCESS_TOKEN: ""
          0SEC_CHATGPT_OAUTH_REFRESH_TOKEN: ""
          0SEC_CHATGPT_ACCOUNT_ID: ""
          0SEC_CHATGPT_AUTH_FILE: "/tmp/0sec-ci-no-auth.json"
          0SEC_CODEX_AUTH_JSON_PATH: "/tmp/0sec-ci-no-auth.json"
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          QWEN_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""
          KIMI_API_KEY: ""
