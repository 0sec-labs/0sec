name: "0sec: Docs"

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cli/**"
      - "packages/shared/**"
      - "scripts/sync-cli-docs.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      pages_preflight:
        description: Read-only homepage Pages gate inspection; skips docs build and deployment
        type: boolean
        default: false
      pages_details:
        description: Inspect the six recorded unfinished deployments and preview binding types only
        type: boolean
        default: false
      disable_auto_production:
        description: Attended action to disable only homepage automatic production deployments
        type: boolean
        default: false
      isolate_preview_views:
        description: Remove only the homepage preview VIEWS binding without deleting its namespace
        type: boolean
        default: false
      expected_production:
        description: Freshly reviewed homepage production deployment UUID
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !inputs.pages_preflight && !inputs.pages_details && !inputs.disable_auto_production && !inputs.isolate_preview_views }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build CLI registrations
        run: pnpm --filter '0sec-cli...' build
      - name: Check CLI documentation freshness
        run: pnpm docs:check
      - run: pnpm --filter @0sec/docs build
      # Publish docs/dist to the Cloudflare Pages project `0sec-docs`
      # (custom domain docs.0.security). Uses npx to avoid wrangler-action's
      # `pnpm add` at the workspace root (ERR_PNPM_ADDING_TO_ROOT).
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e84b55c82d29ff76b789af0aea3d9121
        run: npx --yes wrangler@4 pages deploy docs/dist --project-name=0sec-docs --branch=main

  pages-preflight:
    if: github.repository == '0sec-labs/0sec' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/pages-preflight-20260916' && (inputs.pages_preflight || inputs.pages_details || inputs.disable_auto_production || inputs.isolate_preview_views)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    concurrency:
      group: homepage-pages-control
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Read the fixed homepage Pages target without mutation
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PREFLIGHT: ${{ inputs.pages_preflight }}
          PAGES_DETAILS: ${{ inputs.pages_details }}
          DISABLE_AUTO_PRODUCTION: ${{ inputs.disable_auto_production }}
          ISOLATE_PREVIEW_VIEWS: ${{ inputs.isolate_preview_views }}
          EXPECTED_PRODUCTION: ${{ inputs.expected_production }}
          CUTOVER_RECEIPT: ${{ runner.temp }}/pages-cutover-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const fingerprint = value => createHash('sha256').update(JSON.stringify(value, (_, item) =>
            item && typeof item === 'object' && !Array.isArray(item)
              ? Object.fromEntries(Object.entries(item).sort(([a], [b]) => a.localeCompare(b)))
              : item)).digest('hex');
          const disable = process.env.DISABLE_AUTO_PRODUCTION === 'true';
          const isolate = process.env.ISOLATE_PREVIEW_VIEWS === 'true';
          const mutate = disable || isolate;
          assert([process.env.PAGES_PREFLIGHT, process.env.PAGES_DETAILS, process.env.DISABLE_AUTO_PRODUCTION, process.env.ISOLATE_PREVIEW_VIEWS].filter(value => value === 'true').length === 1, 'Select exactly one control operation');
          const account = 'e84b55c82d29ff76b789af0aea3d9121';
          const project = '0sec-ai-homepage';
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`;
          const uuid = /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/;
          const sourceKeys = new Set(['deployments_enabled', 'owner', 'owner_id', 'repo_id', 'repo_name', 'production_branch', 'pr_comments_enabled', 'production_deployments_enabled', 'preview_deployment_setting', 'preview_branch_includes', 'preview_branch_excludes', 'path_includes', 'path_excludes']);
          const previewSettings = new Set(['always_use_latest_compatibility_date', 'build_image_major_version', 'compatibility_date', 'compatibility_flags', 'usage_model', 'placement', 'limits', 'wrangler_config_hash', 'fail_open']);
          async function get(suffix = '') {
            assert(process.env.CLOUDFLARE_API_TOKEN, 'Missing credential');
            const response = await fetch(endpoint + suffix, {
              method: 'GET',
              redirect: 'error',
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              signal: AbortSignal.timeout(30_000),
            });
            assert(response.ok, `Cloudflare HTTP ${response.status}`);
            const body = await response.json().catch(() => { throw new Error('Invalid Cloudflare JSON response'); });
            assert(body.success === true, 'Cloudflare API rejected read');
            return body;
          }
          const current = (await get()).result;
          assert(current?.name === project && uuid.test(current.id), 'Wrong project identity');
          assert(current.production_branch === 'main' && current.source?.type === 'github', 'Unexpected project source');
          assert(current.domains?.includes('0.security'), 'Canonical domain not attached');
          const config = current.source.config;
          console.log(JSON.stringify({
            authenticated: true, account, project,
            source_owner: config?.owner ?? null,
            source_repository: config?.repo_name ?? null,
            source_repository_id: config?.repo_id ?? null,
            source_branch: config?.production_branch ?? null,
            mutation_performed: false,
          }, null, 2));
          assert(config?.owner === '0sec-labs' && String(config.repo_id) === '1202833352' && typeof config.repo_name === 'string' && config.production_branch === 'main', 'Unexpected source repository or branch');
          assert(Object.keys(current.source).every(key => key === 'type' || key === 'config'), 'Unknown source field');
          assert(Object.keys(config).every(key => sourceKeys.has(key)), 'Unknown source configuration field');
          assert(typeof config.production_deployments_enabled === 'boolean', 'Missing automatic-production setting');
          const canonical = current.canonical_deployment;
          assert(uuid.test(canonical?.id) && canonical.project_name === project && canonical.environment === 'production', 'Invalid canonical deployment');
          assert(canonical.latest_stage?.name === 'deploy' && canonical.latest_stage.status === 'success', 'Canonical deployment not successful');
          if (process.env.PAGES_PREFLIGHT === 'true') {
            const binding = current.deployment_configs?.production?.env_vars?.PUBLIC_TURNSTILE_SITE_KEY;
            const validSiteKey = value => typeof value === 'string' && /^0x[A-Za-z0-9_-]{20,}$/.test(value);
            console.log(JSON.stringify({
              production_public_turnstile_site_key: binding?.type === 'plain_text' && validSiteKey(binding.value) ? binding.value : null,
            }));
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets?per_page=1000&page=1`, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(30_000),
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            });
            if (!response.ok) {
              console.log(JSON.stringify({ turnstile_widget_lookup_http: response.status }));
            } else {
              const body = await response.json();
              assert(body.success === true && Array.isArray(body.result), 'Invalid widget inventory');
              console.log(JSON.stringify({
                turnstile_widget_inventory_complete: body.result.length < 1000,
                production_public_turnstile_widgets: body.result
                  .filter(widget => widget.domains?.includes('0.security') && validSiteKey(widget.sitekey))
                  .map(widget => ({ sitekey: widget.sitekey, domain: '0.security' })),
              }));
            }
          }
          if (mutate) {
            assert(uuid.test(process.env.EXPECTED_PRODUCTION) && canonical.id === process.env.EXPECTED_PRODUCTION, 'Stale production selection');
            assert(canonical.deployment_trigger?.metadata?.branch === 'main', 'Unexpected canonical branch');
          }
          const preview = current.deployment_configs?.preview;
          const previewSafe = preview && typeof preview === 'object' && !Array.isArray(preview) && Object.entries(preview).every(([key, value]) =>
            key === 'env_vars'
              ? value && typeof value === 'object' && !Array.isArray(value) && Object.values(value).every(binding => binding?.type === 'plain_text' && typeof binding.value === 'string')
              : previewSettings.has(key) || value == null || (typeof value === 'object' && Object.keys(value).length === 0));
          if (isolate) {
            assert(config.production_deployments_enabled === false, 'Automatic production must remain disabled');
            assert(preview && typeof preview === 'object' && !Array.isArray(preview), 'Missing preview configuration');
            assert(current.deployment_configs?.production && typeof current.deployment_configs.production === 'object', 'Missing production configuration');
            assert(Object.keys(preview.env_vars ?? {}).length === 0, 'Unexpected preview environment variables');
            const bindings = preview.kv_namespaces ?? {};
            assert(Object.keys(bindings).every(key => key === 'VIEWS'), 'Unexpected preview KV binding');
            if (bindings.VIEWS != null) {
              assert(Object.keys(bindings.VIEWS).length === 1 && /^[a-f0-9]{32}$/.test(bindings.VIEWS.namespace_id), 'Unexpected VIEWS binding shape');
            }
            assert(Object.entries(preview).every(([key, value]) => key === 'kv_namespaces' || key === 'env_vars' || previewSettings.has(key) || value == null || (typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length === 0)), 'Unexpected preview binding kind');
          }
          if (process.env.PAGES_DETAILS === 'true') {
            const ids = [
              'bd52c7a3-9954-4070-b8a0-2e701fb72267', '2d135b4c-fe09-4a9d-86c9-a77a5e37e013',
              '56d917a5-f23e-4f9a-8826-04246f00d7c8', 'ae7b1aa3-9ff4-4372-9464-9575434fe63f',
              '3f8781a3-c9dd-4d3a-8290-430b31ba969c', 'bb477deb-b441-443c-8032-cfabb910fb2e',
            ];
            const details = await Promise.all(ids.map(async id => {
              const value = (await get(`/deployments/${id}`)).result;
              assert(value.id === id && value.project_name === project && value.environment === 'production', 'Deployment identity mismatch');
              return {
                id, created_on: value.created_on,
                latest_stage: { name: value.latest_stage?.name, status: value.latest_stage?.status },
                stages: value.stages?.map(stage => ({ name: stage.name, status: stage.status })),
              };
            }));
            const bindingTypes = Object.entries(preview ?? {}).filter(([key]) => !previewSettings.has(key)).map(([key, value]) => ({
              kind: key,
              names: value && typeof value === 'object' ? Object.keys(value) : [],
              types: key === 'env_vars' && value && typeof value === 'object'
                ? Object.fromEntries(Object.entries(value).map(([name, binding]) => [name, binding?.type ?? null]))
                : undefined,
            }));
            console.log(JSON.stringify({
              captured_at: new Date().toISOString(), account, project,
              canonical_deployment: canonical.id,
              automatic_production: config.production_deployments_enabled,
              preview_binding_types: bindingTypes,
              deployment_details: details,
              mutation_performed: false,
            }, null, 2));
            process.exit(0);
          }
          const seen = new Set();
          const inFlight = [];
          let complete = false;
          for (let page = 1; page <= 1000; page++) {
            const body = await get(`/deployments?per_page=1000&page=${page}${disable ? '&env=production' : ''}`);
            assert(Array.isArray(body.result), 'Malformed deployment inventory');
            for (const item of body.result) {
              if (!(uuid.test(item.id) && item.project_name === project && ['preview', 'production'].includes(item.environment) && !seen.has(item.id))) {
                console.log(JSON.stringify({ inventory_guard: {
                  page, seen_count: seen.size,
                  response_page: Number.isSafeInteger(body.result_info?.page) ? body.result_info.page : null,
                  total_pages: Number.isSafeInteger(body.result_info?.total_pages) ? body.result_info.total_pages : null,
                  id: uuid.test(item.id) ? item.id : null,
                  project_matches: item.project_name === project,
                  environment_matches: ['preview', 'production'].includes(item.environment),
                  duplicate: seen.has(item.id),
                } }));
              }
              assert(uuid.test(item.id) && item.project_name === project && ['preview', 'production'].includes(item.environment) && !seen.has(item.id), 'Unstable deployment inventory');
              seen.add(item.id);
              if ((isolate || item.environment === 'production') && !(['failure', 'canceled'].includes(item.latest_stage?.status) || (item.latest_stage?.name === 'queued' && item.latest_stage.status === 'skipped') || (item.latest_stage?.name === 'deploy' && item.latest_stage.status === 'success'))) inFlight.push(item.id);
            }
            if (body.result.length === 0 || (Number.isSafeInteger(body.result_info?.total_pages) && body.result_info.total_pages > 0 && page >= body.result_info.total_pages)) { complete = true; break; }
          }
          assert(complete, 'Deployment inventory exceeds inspection bound');
          if (mutate) {
            assert(inFlight.length === 0, 'In-flight deployment');
            const fresh = (await get()).result;
            assert(fresh.id === current.id && fresh.canonical_deployment?.id === canonical.id && fingerprint(fresh.source) === fingerprint(current.source), 'Pages state changed during inventory');
            assert(fingerprint(fresh.deployment_configs) === fingerprint(current.deployment_configs), 'Deployment configuration changed during inventory');
            const receipt = {
              schema_version: 1, state: 'prepared', captured_at: new Date().toISOString(),
              operation: isolate ? 'isolate_preview_views' : 'disable_auto_production',
              account, project, project_id: current.id, repository_id: '1202833352',
              run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              workflow_sha: process.env.GITHUB_SHA,
              production_before: canonical.id, automatic_before: config.production_deployments_enabled,
              source_before_fingerprint: fingerprint(fresh.source),
              preview_before_fingerprint: fingerprint(fresh.deployment_configs?.preview ?? null),
              production_config_before_fingerprint: fingerprint(fresh.deployment_configs?.production ?? null),
              rollback: isolate
                ? { setting: 'deployment_configs.preview.kv_namespaces', value: preview.kv_namespaces ?? {} }
                : { setting: 'source.config.production_deployments_enabled', value: config.production_deployments_enabled },
              verification_required_after_interruption: true,
            };
            writeFileSync(process.env.CUTOVER_RECEIPT, JSON.stringify(receipt, null, 2), { flag: 'wx', mode: 0o600 });
            console.log(JSON.stringify(receipt, null, 2));
          }
          console.log(JSON.stringify({
            captured_at: new Date().toISOString(), account, project,
            canonical_deployment: canonical.id,
            automatic_production: config.production_deployments_enabled,
            in_flight_deployments: inFlight,
            preview_bindings_safe: Boolean(previewSafe),
            mutation_performed: false,
          }, null, 2));
          NODE
      - name: Persist credential-free rollback configuration before mutation
        if: inputs.disable_auto_production || inputs.isolate_preview_views
        uses: actions/upload-artifact@v7
        with:
          name: pages-cutover-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-cutover-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply only the prepared homepage control change
        if: inputs.disable_auto_production || inputs.isolate_preview_views
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ISOLATE_PREVIEW_VIEWS: ${{ inputs.isolate_preview_views }}
          EXPECTED_PRODUCTION: ${{ inputs.expected_production }}
          CUTOVER_RECEIPT: ${{ runner.temp }}/pages-cutover-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, openSync, writeFileSync, fsyncSync, closeSync } from 'node:fs';
          const account = 'e84b55c82d29ff76b789af0aea3d9121';
          const project = '0sec-ai-homepage';
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`;
          const receipt = JSON.parse(readFileSync(process.env.CUTOVER_RECEIPT, 'utf8'));
          const isolate = process.env.ISOLATE_PREVIEW_VIEWS === 'true';
          const expectedOperation = isolate ? 'isolate_preview_views' : 'disable_auto_production';
          const fingerprint = value => createHash('sha256').update(JSON.stringify(value, (_, item) =>
            item && typeof item === 'object' && !Array.isArray(item)
              ? Object.fromEntries(Object.entries(item).sort(([a], [b]) => a.localeCompare(b)))
              : item)).digest('hex');
          const withoutKv = value => {
            const result = { ...value };
            delete result.kv_namespaces;
            return result;
          };
          const save = () => {
            const fd = openSync(process.env.CUTOVER_RECEIPT, 'w', 0o600);
            try { writeFileSync(fd, JSON.stringify(receipt, null, 2)); fsyncSync(fd); } finally { closeSync(fd); }
          };
          assert(receipt.state === 'prepared' && receipt.account === account && receipt.project === project && receipt.repository_id === '1202833352', 'Invalid prepared receipt');
          assert(receipt.operation === expectedOperation, 'Wrong prepared operation');
          assert(receipt.run_id === process.env.GITHUB_RUN_ID && receipt.run_attempt === process.env.GITHUB_RUN_ATTEMPT && receipt.workflow_sha === process.env.GITHUB_SHA, 'Wrong workflow receipt');
          assert(receipt.production_before === process.env.EXPECTED_PRODUCTION && typeof receipt.automatic_before === 'boolean', 'Wrong approved selection');
          assert(Date.now() - Date.parse(receipt.captured_at) >= 0 && Date.now() - Date.parse(receipt.captured_at) < 15 * 60_000, 'Stale prepared receipt');
          if (isolate) assert(receipt.automatic_before === false && receipt.rollback?.setting === 'deployment_configs.preview.kv_namespaces', 'Invalid isolation receipt');
          async function api(suffix = '', method = 'GET', body) {
            assert(process.env.CLOUDFLARE_API_TOKEN, 'Missing credential');
            const response = await fetch(endpoint + suffix, {
              method, redirect: 'error', signal: AbortSignal.timeout(30_000),
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'content-type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            assert(response.ok, `Cloudflare HTTP ${response.status}`);
            const parsed = await response.json().catch(() => { throw new Error('Invalid Cloudflare JSON response'); });
            assert(parsed.success === true, 'Cloudflare API rejected operation');
            return parsed;
          }
          function verifyIdentity(value) {
            assert(value?.id === receipt.project_id && value.name === project && value.domains?.includes('0.security'), 'Wrong project identity');
            assert(value.production_branch === 'main' && value.source?.type === 'github', 'Unexpected project source');
            assert(value.source.config.owner === '0sec-labs' && String(value.source.config.repo_id) === '1202833352' && value.source.config.production_branch === 'main', 'Wrong source identity');
            assert(value.canonical_deployment?.id === receipt.production_before && value.canonical_deployment.latest_stage?.name === 'deploy' && value.canonical_deployment.latest_stage.status === 'success', 'Production selection changed');
          }
          let attempted = false;
          try {
            const before = (await api()).result;
            verifyIdentity(before);
            assert(fingerprint(before.source) === receipt.source_before_fingerprint, 'Source settings changed after preparation');
            let complete = false;
            const seen = new Set();
            for (let page = 1; page <= 1000; page++) {
              const body = await api(`/deployments?per_page=1000&page=${page}${isolate ? '' : '&env=production'}`);
              assert(Array.isArray(body.result), 'Malformed deployment inventory');
              for (const item of body.result) {
                assert(typeof item.id === 'string' && item.project_name === project && (isolate ? ['preview', 'production'].includes(item.environment) : item.environment === 'production') && !seen.has(item.id), 'Unstable deployment inventory');
                seen.add(item.id);
                assert(['failure', 'canceled'].includes(item.latest_stage?.status) || (item.latest_stage?.name === 'queued' && item.latest_stage.status === 'skipped') || (item.latest_stage?.name === 'deploy' && item.latest_stage.status === 'success'), 'In-flight deployment');
              }
              if (body.result.length === 0 || (Number.isSafeInteger(body.result_info?.total_pages) && body.result_info.total_pages > 0 && page >= body.result_info.total_pages)) { complete = true; break; }
            }
            assert(complete, 'Deployment inventory exceeds inspection bound');
            const fresh = (await api()).result;
            verifyIdentity(fresh);
            assert(fingerprint(fresh.source) === receipt.source_before_fingerprint, 'Source settings changed before write');
            assert(fingerprint(fresh.deployment_configs?.preview ?? null) === receipt.preview_before_fingerprint, 'Preview bindings changed before write');
            assert(fingerprint(fresh.deployment_configs?.production ?? null) === receipt.production_config_before_fingerprint, 'Production configuration changed before write');
            const source = { ...fresh.source, config: { ...fresh.source.config, production_deployments_enabled: false } };
            const views = fresh.deployment_configs?.preview?.kv_namespaces?.VIEWS;
            const shouldMutate = isolate ? views != null : receipt.automatic_before;
            if (shouldMutate) {
              receipt.state = 'mutation_started';
              receipt.mutation_may_have_occurred = true;
              save();
              attempted = true;
              // Per-key null deletion is documented for env_vars, but not KV maps.
              // Qualify this exact binding-only operation through the readback below.
              await api('', 'PATCH', isolate
                ? { deployment_configs: { preview: { kv_namespaces: { VIEWS: null } } } }
                : { source });
            }
            const after = (await api()).result;
            verifyIdentity(after);
            assert(fingerprint(after.source) === (isolate ? receipt.source_before_fingerprint : fingerprint(source)), 'Unexpected source settings after write');
            assert(after.source.config.production_deployments_enabled === false, 'Automatic production still enabled');
            assert(fingerprint(after.deployment_configs?.production ?? null) === receipt.production_config_before_fingerprint, 'Production configuration changed');
            if (isolate) {
              assert(fingerprint(withoutKv(after.deployment_configs?.preview)) === fingerprint(withoutKv(fresh.deployment_configs?.preview)), 'Unrelated preview settings changed');
              assert(Object.keys(after.deployment_configs?.preview?.kv_namespaces ?? {}).length === 0, 'Preview KV binding remains');
            } else {
              assert(fingerprint(after.deployment_configs?.preview ?? null) === receipt.preview_before_fingerprint, 'Preview bindings changed');
            }
            Object.assign(receipt, {
              state: 'verified', verified_at: new Date().toISOString(),
              production_after: after.canonical_deployment.id, automatic_after: false,
              source_after_fingerprint: fingerprint(after.source),
              preview_after_fingerprint: fingerprint(after.deployment_configs?.preview ?? null),
              production_configuration_unchanged: true,
              preview_binding_removed: isolate,
              namespace_data_mutated: false,
              mutation_performed: attempted,
            });
            save();
            console.log(JSON.stringify(receipt, null, 2));
          } catch (error) {
            Object.assign(receipt, { state: 'failed', mutation_may_have_occurred: attempted, failure: error instanceof Error ? error.message : 'Operation failed' });
            save();
            throw error;
          }
          NODE
      - name: Retain the final credential-free operation receipt
        if: always() && (inputs.disable_auto_production || inputs.isolate_preview_views) && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pages-cutover-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-cutover-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
