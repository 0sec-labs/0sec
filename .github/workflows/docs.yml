name: "0sec: Docs"

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @0sec/docs build
      # Publishes docs/dist to the Cloudflare Pages project `0sec-docs`
      # (custom domain docs.0.security). Requires repo secret
      # CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages: Edit).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e84b55c82d29ff76b789af0aea3d9121
          command: pages deploy docs/dist --project-name=0sec-docs --branch=main
