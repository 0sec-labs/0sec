name: Binary Build

# Proves the Bun standalone-binary distribution path works end-to-end.
# Builds a self-contained binary per platform/arch via `bun build --compile`
# on native runners (cross-compiling fails for @opentui/core-* platform
# variants), then runs the full install-smoke suite against each binary
# on the same platform it was built for.
#
# Runner allocation:
#   linux-x64      — self-hosted (titan pool)
#   linux-arm64    — GH-hosted `ubuntu-24.04-arm`
#   darwin-arm64   — GH-hosted `macos-14`
#   windows-x64    — GH-hosted `windows-latest`
#
# darwin-x64 (Intel Mac) is intentionally dropped. Apple hasn't shipped
# Intel Macs since 2022 and GH's macos-13 pool is flaky to the point of
# multi-hour queues. Intel users can compile from source with Bun.
#
# Windows smoke is skipped — scripts/smoke-cli.sh is bash and would need
# a PowerShell port. The Windows binary is still built and uploaded.
#
# No release upload here — that lives in release.yml once this path is
# trusted.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/bun-compile.sh"
      - "scripts/smoke-cli.sh"
      - ".github/workflows/binary-build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/bun-compile.sh"
      - "scripts/smoke-cli.sh"
      - ".github/workflows/binary-build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: '["self-hosted", "Linux", "X64"]'
            run_smoke: true
          - label: linux-arm64
            runs_on: '"ubuntu-24.04-arm"'
            run_smoke: true
          - label: darwin-arm64
            runs_on: '"macos-14"'
            run_smoke: true
          - label: windows-x64
            runs_on: '"windows-latest"'
            run_smoke: false
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Clean workspace artifacts (self-hosted runners can carry state)
        run: rm -rf dist-bin dist node_modules packages/*/node_modules packages/*/dist
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: corepack enable && corepack prepare pnpm@9 --activate
        shell: bash

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # Produces dist/ for each @pwnkit/* package so Bun can resolve the
        # workspace imports at compile time.
        run: pnpm -r build

      - name: Compile standalone binary
        # No --target arg: bun compiles for the host platform, which matches
        # the runner's OS/arch. This avoids the @opentui/core platform-variant
        # issue that breaks cross-compile.
        run: bash scripts/bun-compile.sh
        shell: bash

      - name: Rename binary with platform label
        run: |
          cd dist-bin
          if [ -f pwnkit.exe ]; then
            mv pwnkit.exe pwnkit-${{ matrix.label }}.exe
          else
            mv pwnkit pwnkit-${{ matrix.label }}
          fi
          ls -lh
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pwnkit-${{ matrix.label }}
          path: dist-bin/pwnkit-*
          if-no-files-found: error
          retention-days: 7

      - name: Sanity --help
        if: matrix.run_smoke
        run: ./dist-bin/pwnkit-${{ matrix.label }} --help
        shell: bash

      - name: Full smoke suite
        if: matrix.run_smoke
        run: bash scripts/smoke-cli.sh "$GITHUB_WORKSPACE/dist-bin/pwnkit-${{ matrix.label }}"
        shell: bash

  # ── Cross-runner binary smoke ─────────────────────────────────────────
  # Catches the v0.10.0 / v0.10.1 failure mode: `bun build --compile` baked
  # the build host's `__dirname` into the binary, so on any other filesystem
  # the path didn't exist and node-sqlite3-wasm crashed at startup with
  # ENOENT before we even reached main(). The build job above runs the
  # smoke suite on the SAME runner that built the binary, where the baked-in
  # path happens to exist. This job runs the binary on a FRESH GH-hosted
  # runner, so any baked CI-host path will reliably be missing — exactly
  # the user-side failure mode.
  #
  # Runner allocation deliberately diverges from the build matrix:
  #   linux-x64    — built on self-hosted, smoked on ubuntu-latest
  #   linux-arm64  — built on ubuntu-24.04-arm, smoked on a fresh
  #                  ubuntu-24.04-arm VM (different ephemeral filesystem)
  #   darwin-arm64 — built on macos-14, smoked on a fresh macos-14 VM
  #   windows-x64  — built on windows-latest, smoked on a fresh
  #                  windows-latest VM (different ephemeral filesystem)
  binary-smoke:
    name: binary-smoke (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: '"ubuntu-latest"'
          - label: linux-arm64
            runs_on: '"ubuntu-24.04-arm"'
          - label: darwin-arm64
            runs_on: '"macos-14"'
          - label: windows-x64
            runs_on: '"windows-latest"'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 10
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: pwnkit-${{ matrix.label }}
          path: dist-bin

      - name: Resolve binary path
        id: bin
        shell: bash
        run: |
          ls -lh dist-bin
          if [ -f "dist-bin/pwnkit-${{ matrix.label }}.exe" ]; then
            P="dist-bin/pwnkit-${{ matrix.label }}.exe"
          else
            P="dist-bin/pwnkit-${{ matrix.label }}"
            chmod +x "$P"
          fi
          echo "path=$P" >> "$GITHUB_OUTPUT"

      # Structural check: scan the binary for build-host filesystem paths
      # baked in by `bun build --compile`. The pattern targets the repo's
      # GH Actions workspace layout (`<runner-root>/.../pwnkit/pwnkit/...`)
      # so we don't false-positive on Bun's own statically linked WebKit
      # headers (`_temp/webkit-release/...`) or upstream packages that ship
      # with their own runner paths (e.g. opentui's `runner/work/opentui/`).
      #
      # Windows binary is skipped here: stock `windows-latest` lacks
      # `strings` and PowerShell's text-scanning is heavyweight for a
      # belt-and-suspenders check. The runtime smoke below is the primary
      # guard for Windows; the absolute-path failure mode is dominantly a
      # Unix concern (Windows binaries embed short relative refs more
      # often than full paths).
      - name: Structural absolute-path check
        if: matrix.label != 'windows-x64'
        shell: bash
        run: |
          BIN="${{ steps.bin.outputs.path }}"
          BAD=$(strings "$BIN" 2>/dev/null \
            | grep -E '(_work|actions-runner)/.*pwnkit/pwnkit/|/runner/work/pwnkit/pwnkit/' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::CI-host build path baked into binary — would fail on user filesystems."
            echo "Offending strings (first 10):"
            echo "$BAD" | head -10
            echo
            echo "Fix pattern: add the offending package to scripts/bun-compile.sh as --external"
            echo "and lazy-import it inside its caller (see PR #242 for node-sqlite3-wasm)."
            exit 1
          fi
          echo "OK — no pwnkit-repo build paths baked into binary."

      - name: Runtime smoke — --version
        shell: bash
        run: |
          BIN="${{ steps.bin.outputs.path }}"
          OUT=$("$BIN" --version)
          echo "version output: $OUT"
          # Expect a semver-shaped string. Any crash on startup (the
          # v0.10.0 / v0.10.1 failure mode) bubbles up as a non-zero exit
          # well before this check runs.
          echo "$OUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::--version did not print a version string"
            exit 1
          }

      - name: Runtime smoke — history --db-path (DB init on fresh fs)
        shell: bash
        run: |
          BIN="${{ steps.bin.outputs.path }}"
          # On Windows we resolve via $RUNNER_TEMP (Git Bash maps the
          # Windows %TEMP% there); POSIX runners get plain /tmp.
          if [ "${{ matrix.label }}" = "windows-x64" ]; then
            DB="${RUNNER_TEMP:-/tmp}/smoke.db"
          else
            DB="/tmp/smoke.db"
          fi
          rm -f "$DB"
          "$BIN" history --db-path "$DB"
          # history exits 0 on an empty DB. The point is that DB init
          # (pwnkitDB ctor → schema bootstrap → drizzle session wiring)
          # didn't crash — which is precisely the v0.10.0 failure mode
          # we're guarding against.
