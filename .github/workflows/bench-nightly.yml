name: "PwnKit: Bench regression gate (nightly)"

# Nightly A/B-harness regression gate (pwnkit#656). Runs the champion variant
# against the labeled corpus CI subset (#657), aggregates a scorecard, and
# FAILS the run if the champion regressed vs the last green entry in the
# committed benchmark ledger (success rate dropped or FP rate rose beyond
# threshold). This is the falsifiable backstop: a prompt/model/flag change that
# quietly makes pwnkit worse gets caught here.
#
# Baseline policy: the gate compares against the committed
# `packages/core/src/bench/benchmark-ledger.json`. The job uploads the UPDATED
# ledger as an artifact but never auto-commits it (repo policy: no unattended
# pushes). To move the baseline, download the artifact and commit it in a
# reviewed PR — a deliberate "we accept this new champion" act, mirroring the
# corpus freeze discipline.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      variants:
        description: "Path to a variants JSON file relative to repo root, or blank for the single champion"
        required: false
        default: ""

concurrency:
  group: bench-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bench-gate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap runner (corepack pnpm + cache preflight)
        run: bash "$GITHUB_WORKSPACE/scripts/ci-runner-bootstrap.sh"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run tournament + regression gate (CI subset)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LEDGER="packages/core/src/bench/benchmark-ledger.json"
          VARIANTS_ARG=""
          if [ -n "${{ github.event.inputs.variants }}" ]; then
            VARIANTS_ARG="--variants ${{ github.event.inputs.variants }}"
          fi
          node dist/pwnkit.js bench run \
            --ci-subset \
            --gate \
            --runtime api \
            --ledger "$LEDGER" \
            --run-id "${GITHUB_SHA::12}" \
            $VARIANTS_ARG

      - name: Upload updated benchmark ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ledger
          path: packages/core/src/bench/benchmark-ledger.json
          if-no-files-found: warn
